<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top-bar">
    <div class="selectors">
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <select id="mode">
        <option value="timed">Timed (60s)</option>
        <option value="passage">Passage</option>
      </select>
    </div>

    <button id="startBtn">Start Test</button>
    <button id="restartBtn">Restart</button>
  </header>

  <section class="stats">
    <div>WPM: <span id="wpm">0</span></div>
    <div>Accuracy: <span id="accuracy">100%</span></div>
    <div>Time: <span id="time">0:00</span></div>
  </section>

  <main>
    <div id="passage" class="passage"></div>
  </main>

  <section id="results" class="results hidden">
    <h2>Results</h2>
    <p>WPM: <span id="finalWpm"></span></p>
    <p>Accuracy: <span id="finalAccuracy"></span></p>
    <p>Correct Characters: <span id="finalCorrect"></span></p>
    <p>Incorrect Characters: <span id="finalIncorrect"></span></p>
    <p id="bestMessage"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
